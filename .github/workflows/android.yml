name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests & release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: ver
        run: echo "version=$(grep '^versionName=' version.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Decode signing key (only when secrets are configured)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release signing key configured."
          else
            echo "No signing secrets; release APK will be signed with the debug key."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble release and debug APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest

      - name: Remove key material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/GoldenGateDesktop.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/GoldenGateDesktop-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/androidTest.apk
          (cd dist && sha256sum GoldenGateDesktop.apk GoldenGateDesktop-debug.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldenGateDesktop-release-apk
          path: |
            dist/GoldenGateDesktop.apk
            dist/SHA256SUMS.txt

      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: test-apks
          path: |
            dist/GoldenGateDesktop-debug.apk
            dist/androidTest.apk
          retention-days: 7

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 14

  device-tests:
    name: Emulator UI tests (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tablet
            profile: pixel_c
            suite: all
          - name: phone
            profile: pixel_6
            suite: io.github.goldengate.desktop.ScreenshotTour
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-apks
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: GoldenGateDesktop-release-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: SUITE=${{ matrix.suite }} bash scripts/run-device-tests.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.name }}
          path: device-output/

  release:
    name: Publish GitHub Release
    needs: [ build, device-tests ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GoldenGateDesktop-release-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: screenshots-tablet
          path: shots
      - name: Compute tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT";
          else echo "tag=v${{ needs.build.outputs.version }}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"; fi
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Golden Gate Desktop ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Automated build of `${{ github.sha }}` from run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Unit tests and emulator UI tests passed before this release was published.

            Install: download `GoldenGateDesktop.apk` below on an Android 8.0+ device and open it (allow "Install unknown apps" for your browser/file manager when prompted).
            Verify with `SHA256SUMS.txt`.
          files: |
            dist/GoldenGateDesktop.apk
            dist/SHA256SUMS.txt
